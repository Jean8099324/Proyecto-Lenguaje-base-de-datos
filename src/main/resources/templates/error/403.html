<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso restringido | Rescate Vial CR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/cliente-inicio.css}">
</head><body><main class="dashboard-content"><section class="dashboard-card portal-section"><div class="portal-body">
<span class="section-label">ACCESO RESTRINGIDO · 403</span><h1>No tienes acceso a esta sección</h1><p>Tu cuenta no tiene permisos para abrir esta página. Puedes continuar desde tu inicio.</p>
<a th:if="${esAdministrador}" class="portal-secondary" th:href="@{/dashboard}">Volver al dashboard</a>
<a th:if="${esCliente and !esAdministrador}" class="portal-secondary" th:href="@{/cliente/inicio}">Volver a mi portal</a>
<a th:unless="${sesionAutenticada}" class="portal-secondary" th:href="@{/login}">Iniciar sesión</a>
<form th:if="${sesionAutenticada}" th:action="@{/logout}" method="post" class="mt-3"><button class="btn-new-incident" type="submit">Cerrar sesión</button></form>
</div></section></main></body></html>
