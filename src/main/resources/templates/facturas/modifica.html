<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${modoEdicion} ? 'Modificar Factura | Rescate Vial CR' : 'Nueva Factura | Rescate Vial CR'">
        Facturación
    </title>

    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- ESTILOS DEL SISTEMA -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/facturas.css}">
</head>

<body>

    <div class="container py-5">

        <!-- VOLVER AL LISTADO -->
        <a th:href="@{/facturas/listado}" class="btn btn-outline-secondary mb-4">

            <i class="bi bi-arrow-left"></i>
            Volver a facturación
        </a>

        <!-- ENCABEZADO -->
        <div class="mb-4">

            <span class="section-label">
                FINANZAS / FACTURACIÓN
            </span>

            <h2 class="fw-bold" th:text="${modoEdicion} ? 'Modificar factura' : 'Registrar nueva factura'">
                Registrar nueva factura
            </h2>

            <p class="text-muted">
                Complete los datos de la factura.
            </p>

        </div>

        <!-- FORMULARIO -->
        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <form th:object="${factura}" th:action="${modoEdicion} ? @{/facturas/actualizar} : @{/facturas/guardar}"
                    method="post">

                    <!-- TOKEN CSRF -->
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                    <!-- ID DE FACTURA -->
                    <input type="hidden" th:field="*{idFactura}">

                    <div class="row g-3">

                        <!-- FECHA -->
                        <div class="col-md-6">

                            <label for="fechaFactura" class="form-label fw-semibold">
                                Fecha de factura
                            </label>

                            <input type="date" id="fechaFactura" th:field="*{fechaFactura}" class="form-control"
                                required>

                        </div>

                        <!-- HORA -->
                        <div class="col-md-6">

                            <label for="horaFactura" class="form-label fw-semibold">
                                Hora de factura
                            </label>

                            <input type="time" id="horaFactura" th:field="*{horaFactura}" class="form-control" required>

                        </div>

                        <!-- VENTA -->
                        <div class="col-md-6">

                            <label for="idVenta" class="form-label fw-semibold">
                                ID de venta
                            </label>

                            <input type="number" id="idVenta" th:field="*{idVenta}" class="form-control" min="1"
                                placeholder="Ingrese el ID de venta" required>

                            <small class="text-muted">
                                Debe corresponder a una venta existente en Oracle.
                            </small>

                        </div>

                        <!-- ESTADO -->
                        <div class="col-md-6">

                            <label for="idEstado" class="form-label fw-semibold">
                                Estado
                            </label>

                            <select id="idEstado" th:field="*{idEstado}" class="form-select" required>

                                <option value="">Seleccione un estado</option>
                                <option value="1">Activo</option>
                                <option value="2">Inactivo</option>

                            </select>

                        </div>

                        <!-- SUBTOTAL -->
                        <div class="col-md-6">

                            <label for="subtotal" class="form-label fw-semibold">
                                Subtotal (₡)
                            </label>

                            <input type="number" id="subtotal" th:field="*{subtotal}" class="form-control" min="0"
                                step="0.01" required>

                        </div>

                        <!-- DEDUCCIONES -->
                        <div class="col-md-6">

                            <label for="totalDeducciones" class="form-label fw-semibold">
                                Total deducciones (₡)
                            </label>

                            <input type="number" id="totalDeducciones" th:field="*{totalDeducciones}"
                                class="form-control" min="0" step="0.01" required>

                        </div>

                        <!-- IMPUESTOS -->
                        <div class="col-md-6">

                            <label for="totalImpuestos" class="form-label fw-semibold">
                                Total impuestos (₡)
                            </label>

                            <input type="number" id="totalImpuestos" th:field="*{totalImpuestos}" class="form-control"
                                min="0" step="0.01" required>

                        </div>

                        <!-- TOTAL FACTURA -->
                        <div class="col-md-6">

                            <label for="totalFactura" class="form-label fw-semibold">
                                Total factura (₡)
                            </label>

                            <input type="number" id="totalFactura" th:field="*{totalFactura}" class="form-control"
                                min="0" step="0.01" required>

                        </div>

                    </div>

                    <!-- BOTONES -->
                    <div class="d-flex justify-content-end gap-2 mt-4">

                        <a th:href="@{/facturas/listado}" class="btn btn-outline-secondary">

                            <i class="bi bi-x-circle"></i>
                            Cancelar
                        </a>

                        <button type="submit" class="btn-factura-nueva border-0">

                            <i class="bi bi-save"></i>

                            <span th:text="${modoEdicion} ? 'Guardar cambios' : 'Registrar factura'">
                                Registrar factura
                            </span>

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/facturas.js}"></script>

</body>

</html>
