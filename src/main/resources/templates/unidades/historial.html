<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Historial de unidades</title><link rel="stylesheet" href="/css/usuarios.css"><link rel="stylesheet" href="/css/incidentes.css"></head><body><main class="page-content"><section class="page-heading"><div><span class="section-label">OPERACIONES</span><h2>Historial de unidades</h2><p>Movimientos y cambios de estado de <strong th:text="${unidad.nombre}"></strong>.</p></div><a class="btn-secondary-custom" href="/unidades">Volver</a></section><section class="content-card"><div class="table-responsive"><table class="clients-table"><thead><tr><th>HISTORIAL</th><th>INCIDENTE</th><th>ESTADO</th><th>SALIDA</th><th>REGRESO</th><th>OBSERVACIONES</th></tr></thead><tbody><tr th:each="h:${historial}"><td th:text="${h.ID_HISTORIAL}"></td><td th:text="${h.ID_INCIDENTE != null ? '#' + h.ID_INCIDENTE : '—'}"></td><td th:text="${h.NOMBRE_ESTADO}"></td><td th:text="${h.FECHA_SALIDA_UNIDAD != null ? h.FECHA_SALIDA_UNIDAD + ' ' + h.HORA_SALIDA_UNIDAD : '—'}"></td><td th:text="${h.FECHA_REGRESO_UNIDAD != null ? h.FECHA_REGRESO_UNIDAD + ' ' + h.HORA_REGRESO_UNIDAD : 'Pendiente'}"></td><td th:text="${h.OBSERVACIONES != null ? h.OBSERVACIONES : '—'}"></td></tr><tr th:if="${#lists.isEmpty(historial)}"><td colspan="6">No hay movimientos registrados.</td></tr></tbody></table></div></section></main></body></html>
