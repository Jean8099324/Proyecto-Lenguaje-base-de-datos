<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Unidades</title><link rel="stylesheet" href="/css/usuarios.css"><link rel="stylesheet" href="/css/incidentes.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"></head><body><div class="app-layout"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><a class="sidebar-brand-link" href="/dashboard" aria-label="Ir al inicio"><div class="brand-icon"><i class="bi bi-truck"></i></div><div class="brand-text"><h1>Rescate Vial CR</h1><span>Gestión de Asistencia Vial</span></div></a><button type="button" class="close-sidebar" id="closeSidebar" aria-label="Cerrar men?"><i class="bi bi-x-lg"></i></button></div><nav class="sidebar-nav"><div class="nav-section"><span class="nav-title">PRINCIPAL</span><a href="/dashboard" class="nav-link"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a></div><div class="nav-section"><span class="nav-title">OPERACIONES</span><a href="/incidentes/listado" class="nav-link"><i class="bi bi-exclamation-triangle"></i><span>Incidentes</span></a><a href="/despacho" class="nav-link"><i class="bi bi-send"></i><span>Despacho</span></a><a href="/unidades" class="nav-link active"><i class="bi bi-truck-front"></i><span>Unidades</span></a></div></nav></aside><div class="sidebar-overlay" id="sidebarOverlay"></div><div class="main-content"><header class="topbar"><div class="topbar-left"><button type="button" class="menu-button" id="menuButton" aria-label="Abrir men?"><i class="bi bi-list"></i></button><h2>Unidades</h2><span>Gestión de disponibilidad</span></div></header><main class="page-content"><section class="page-heading"><div><span class="section-label">OPERACIONES</span><h2>Unidades</h2><p>Administre las unidades y su disponibilidad operativa.</p></div><a class="btn-primary-custom" href="/unidades/nuevo">+ Nueva unidad</a></section><section class="content-card"><div class="incident-filters"><input id="buscarUnidad" type="search" placeholder="Buscar por nombre o placa..."><select id="filtroTipo"><option value="">Todos los tipos</option><option th:each="t:${tipos}" th:value="${t.nombre}" th:text="${t.nombre}"></option></select><select id="filtroEstado"><option value="">Todos los estados</option><option th:each="e:${estados}" th:value="${e.nombreEstado}" th:text="${e.nombreEstado}"></option></select></div><div class="table-responsive"><table class="clients-table units-table"><thead><tr><th><button class="sort-button" data-sort="nombre" type="button">NOMBRE <i class="bi bi-arrow-down-up"></i></button></th><th><button class="sort-button" data-sort="tipo" type="button">TIPO <i class="bi bi-arrow-down-up"></i></button></th><th><button class="sort-button" data-sort="placa" type="button">PLACA <i class="bi bi-arrow-down-up"></i></button></th><th><button class="sort-button" data-sort="estado" type="button">ESTADO <i class="bi bi-arrow-down-up"></i></button></th><th>ACCIONES</th></tr></thead><tbody id="tablaUnidades"><tr th:each="u:${unidades}" th:data-nombre="${u.nombre}" th:data-tipo="${u.tipoNombre}" th:data-placa="${u.placa}" th:data-estado="${u.estadoNombre}"><td th:text="${u.nombre}"></td><td th:text="${u.tipoNombre}"></td><td th:text="${u.placa != null ? u.placa : '—'}"></td><td th:text="${u.estadoNombre}"></td><td class="incident-actions"><a class="action-btn view" th:href="@{/unidades/{id}/historial(id=${u.id})}"><i class="bi bi-eye"></i></a><a class="action-btn edit" th:href="@{/unidades/editar/{id}(id=${u.id})}"><i class="bi bi-pencil-square"></i></a><form th:action="@{/unidades/{id}/desactivar(id=${u.id})}" method="post"><button class="action-btn delete" type="submit"><i class="bi bi-archive"></i></button></form></td></tr></tbody></table></div></section></main></div></div><script src="/js/sidebar.js"></script><script src="/js/unidades.js"></script></body></html>
