<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unidad</title><link rel="stylesheet" href="/css/usuarios.css"><link rel="stylesheet" href="/css/incidentes.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><style>.unit-form-card{max-width:980px;margin:0 auto;padding:28px 32px}.unit-form-title{margin:0 0 24px;color:var(--primary);font-size:25px}.unit-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px}.unit-form-group{display:flex;flex-direction:column;gap:7px}.unit-form-group.full{grid-column:1/-1}.unit-form-group label{color:var(--primary);font-size:12px;font-weight:700}.unit-form-group input,.unit-form-group select{width:100%;height:42px;padding:0 12px;border:1px solid var(--border);border-radius:8px;color:var(--text);background:#fff;font-size:14px}.unit-form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}.unit-form-actions a{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 18px;border:1px solid var(--border);border-radius:8px;color:var(--primary);text-decoration:none}.unit-form-actions button{height:42px;padding:0 20px;border:0;border-radius:8px;background:#ed3748;color:#fff;font-weight:700}@media(max-width:700px){.unit-form-grid{grid-template-columns:1fr}.unit-form-card{padding:22px 18px}}</style></head>
<body><div class="app-layout"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><div class="sidebar-overlay" id="sidebarOverlay"></div><div class="main-content"><header class="topbar"><div class="topbar-left"><button type="button" class="menu-button" id="menuButton" aria-label="Abrir men?"><i class="bi bi-list"></i></button><h2>Unidades</h2><span>Gestión de disponibilidad</span></div></header><main class="page-content"><section class="page-heading"><div><span class="section-label">OPERACIONES</span><h2 th:text="${unidadForm.id == null ? 'Nueva unidad' : 'Editar unidad'}">Editar unidad</h2><p>Complete la información operativa de la unidad.</p></div></section><section class="content-card unit-form-card"><h3 class="unit-form-title"><i class="bi bi-truck-front"></i> Información de la unidad</h3><form th:action="@{/unidades/guardar}" th:object="${unidadForm}" method="post"><input type="hidden" th:field="*{id}"><div class="unit-form-grid"><div class="unit-form-group"><label for="nombre">Nombre de la unidad</label><input id="nombre" th:field="*{nombre}" required maxlength="100"></div><div class="unit-form-group"><label for="idTipo">Tipo de unidad</label><select id="idTipo" th:field="*{idTipo}" required><option value="">Seleccione un tipo</option><option th:each="t:${tipos}" th:value="${t.id}" th:text="${t.nombre}"></option></select></div><div class="unit-form-group"><label for="placa">Placa</label><input id="placa" th:field="*{placa}" maxlength="20" placeholder="Ej. GRU404"></div><div class="unit-form-group"><label for="idEstado">Estado operativo</label><select id="idEstado" th:field="*{idEstado}" required><option value="">Seleccione un estado</option><option th:each="e:${estados}" th:value="${e.id}" th:text="${e.nombreEstado}"></option></select></div></div><div class="unit-form-actions"><a href="/unidades">Cancelar</a><button type="submit"><i class="bi bi-check-lg"></i> Guardar unidad</button></div></form></section></main></div></div><script src="/js/sidebar.js"></script><script src="/js/unidades.js"></script></body></html>
