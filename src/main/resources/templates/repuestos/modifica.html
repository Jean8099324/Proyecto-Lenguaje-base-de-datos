<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repuestos | Rescate Vial CR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/repuestos.css}">
</head>

<body>
    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="main-content">
            <header class="topbar">

                <div class="topbar-left">

                    <button class="menu-button" id="menuButton">
                        <i class="bi bi-list"></i>
                    </button>

                    <div>
                        <h2>Repuestos</h2>
                        <span>Gestión de inventario y repuestos</span>
                    </div>

                </div>

                <div class="topbar-right">

                    <button class="topbar-action" title="Notificaciones (en construcción)" disabled>
                        <i class="bi bi-bell"></i>
                        <i class="bi bi-cone-striped construction-action-marker" aria-label="En construcción"></i>
                    </button>

                    <div class="user-divider"></div>

                    <div class="user-profile">

                        <!-- Datos de sesión preparados por UsuarioDetailsService, siguiendo el patrón de proyecto_final_tienda. -->
                        <div class="user-avatar"
                            th:text="${session.inicialesUsuario != null ? session.inicialesUsuario : 'U'}">U</div>

                        <div class="user-info">
                            <strong
                                th:text="${session.nombreUsuario != null ? session.nombreUsuario : #authentication.name}">Usuario</strong>
                            <span
                                th:text="${session.usernameUsuario != null ? session.usernameUsuario : #authentication.name}">usuario</span>
                        </div>

                        <i class="bi bi-cone-striped construction-profile-marker"
                            title="Menú de usuario en construcción"></i>

                    </div>

                    <!-- Cerrar sesión de forma segura con Spring Security -->
                    <form th:action="@{/logout}" method="post" class="logout-form" style="margin: 0;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="topbar-action" title="Cerrar sesión" aria-label="Cerrar sesión">
                            <i class="bi bi-box-arrow-right"></i>
                            <span class="visually-hidden">Cerrar sesión</span>
                        </button>
                    </form>

                </div>

            </header>
            <main class="dashboard-content repuestos-page">
                <section class="welcome-section repuestos-heading">
                    <div><span class="section-label">SERVICIOS / INVENTARIO</span>
                        <h2 th:text="${modoEdicion} ? 'Modificar repuesto' : 'Registrar nuevo repuesto'">Registrar
                            repuesto</h2>
                        <p>Complete la información del repuesto.</p>
                    </div><a th:href="@{/repuestos/listado}" class="btn-repuestos-secondary"><i
                            class="bi bi-arrow-left"></i> Volver al listado</a>
                </section>
                <section class="dashboard-card repuestos-card">
                    <div class="card-header-custom">
                        <div><span class="section-label">INVENTARIO</span>
                            <h3 th:text="${modoEdicion} ? 'Editar información' : 'Datos del repuesto'">Datos del
                                repuesto</h3>
                        </div>
                    </div>
                    <form class="repuestos-form" th:object="${repuesto}"
                        th:action="${modoEdicion} ? @{/repuestos/actualizar} : @{/repuestos/guardar}" method="post">
                        <input type="hidden" th:field="*{idRepuesto}">
                        <div class="row g-4">
                            <div class="col-md-6"><label for="nombreRepuesto" class="form-label">Nombre del
                                    repuesto</label><input id="nombreRepuesto" type="text" th:field="*{nombreRepuesto}"
                                    class="form-control" maxlength="100" required placeholder="Nombre del repuesto">
                            </div>
                            <div class="col-md-6"><label for="precioUnitario" class="form-label">Precio unitario
                                    (₡)</label><input id="precioUnitario" type="number" th:field="*{precioUnitario}"
                                    class="form-control" min="0" step="0.01" required placeholder="0.00"></div>
                            <div class="col-12"><label for="descripcionRepuesto"
                                    class="form-label">Descripción</label><textarea id="descripcionRepuesto"
                                    th:field="*{descripcionRepuesto}" class="form-control" rows="4" maxlength="500"
                                    placeholder="Descripción del repuesto"></textarea></div>
                            <div class="col-md-6"><label for="idEstado" class="form-label">Estado</label><select
                                    id="idEstado" th:field="*{idEstado}" class="form-select" required>
                                    <option value="">Seleccione un estado</option>
                                    <option value="1">Activo</option>
                                    <option value="2">Inactivo</option>
                                </select></div>
                        </div>
                        <div class="repuestos-form-actions"><a th:href="@{/repuestos/listado}"
                                class="btn-repuestos-secondary"><i class="bi bi-x-lg"></i> Cancelar</a><button
                                type="submit" class="btn-repuestos-primary"><i class="bi bi-check2-circle"></i> <span
                                    th:text="${modoEdicion} ? 'Guardar cambios' : 'Registrar repuesto'">Registrar
                                    repuesto</span></button></div>
                    </form>
                </section>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/dashboard.js}"></script>
    <script th:src="@{/js/repuestos.js}"></script>
<script src="/js/sidebar.js"></script></body>

</html>
