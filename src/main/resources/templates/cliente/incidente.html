<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi incidente | Rescate Vial CR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/cliente-inicio.css}">
</head><body class="cliente-inicio"><div class="app-layout"><aside th:replace="~{cliente/sidebar :: sidebar}"></aside><div class="sidebar-overlay" id="sidebarOverlay"></div><div class="main-content"><header class="topbar"><div class="topbar-left"><button class="menu-button" id="menuButton" type="button" aria-label="Abrir menú"><i class="bi bi-list"></i></button><div><h2>Mis incidentes</h2><span>Portal del cliente</span></div></div><form th:action="@{/logout}" method="post"><button class="topbar-action" type="submit" aria-label="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button></form></header><main class="dashboard-content">
<section class="welcome-section"><div><span class="section-label">MI SOLICITUD</span><h2>Incidente #<span th:text="${incidente.id}"></span></h2></div><a class="portal-secondary" th:href="@{/cliente/inicio#mis-incidentes}">Volver a mis incidentes</a></section>
<section class="dashboard-card"><div class="card-header-custom"><h3>Detalle de mi reporte</h3><span class="status-badge dispatched" th:text="${estado}"></span></div>
<dl class="cliente-datos"><div><dt>Fecha y hora</dt><dd th:text="${incidente.fechaReporte + ' ' + incidente.horaReporte}"></dd></div><div><dt>Descripción</dt><dd th:text="${incidente.detalles}"></dd></div><div><dt>Otras señas</dt><dd th:text="${incidente.otrasSenas}"></dd></div></dl></section>
</main></div></div><script th:src="@{/js/sidebar.js}"></script><script th:src="@{/js/cliente-inicio.js}"></script></body></html>
