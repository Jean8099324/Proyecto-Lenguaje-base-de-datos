<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rescate Vial CR | Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/usuarios.css">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="main-content">
        <header class="topbar"><div class="topbar-left"><button type="button" class="menu-button" id="menuButton"><i class="bi bi-list"></i></button><div><h2>Clientes</h2><span>Administración de clientes</span></div></div><div class="topbar-right"><div class="user-divider"></div><div class="user-profile"><div class="user-avatar" th:text="${session.inicialesUsuario != null ? session.inicialesUsuario : 'U'}">U</div><div class="user-info"><strong th:text="${session.nombreUsuario != null ? session.nombreUsuario : #authentication.name}">Usuario</strong><span th:text="${session.usernameUsuario != null ? session.usernameUsuario : #authentication.name}">usuario</span></div></div><form th:action="@{/logout}" method="post"><button type="submit" class="topbar-action" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button></form></div></header>
        <main class="page-content">
            <section class="page-heading"><div><span class="section-label">GESTIÓN DEL SISTEMA</span><h2>Clientes</h2><p>Consulte y administre los clientes registrados.</p></div><a class="btn-primary-custom" href="/clientes/nuevo"><i class="bi bi-person-plus"></i> Nuevo cliente</a></section>
            <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
            <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>
            <section class="content-card">
                <div class="content-card-header"><div><span class="section-label">REGISTROS</span><h3>Clientes registrados</h3></div><div class="table-tools"><div class="search-box"><i class="bi bi-search"></i><input type="search" id="buscarCliente" placeholder="Buscar por nombre o usuario..."></div></div></div>
                <div class="table-responsive">
                    <table class="clients-table"><thead><tr><th>ID</th><th>NOMBRE</th><th>USERNAME</th><th>ESTADO</th><th>ACCIONES</th></tr></thead>
                        <tbody id="tablaClientes">
                        <tr th:each="cliente : ${clientes}">
                            <td th:text="${cliente.id}">1</td>
                            <td th:text="${cliente.nombre + ' ' + cliente.primerApellido + (cliente.segundoApellido != null ? ' ' + cliente.segundoApellido : '')}">Nombre</td>
                            <td th:text="${cliente.username}">usuario</td>
                            <td th:text="${cliente.estadoNombre}">ACTIVO</td>
                            <td><div class="d-flex gap-2 align-items-center">
                                <a class="action-btn edit" th:href="@{/clientes/editar/{id}(id=${cliente.id})}" title="Editar cliente"><i class="bi bi-pencil-square"></i></a>
                                <form th:if="${cliente.estadoNombre == 'ACTIVO'}" th:action="@{/clientes/{id}/desactivar(id=${cliente.id})}" method="post" onsubmit="return confirm('¿Desactivar este cliente?');"><button type="submit" class="btn btn-sm btn-outline-danger">Desactivar</button></form>
                                <form th:unless="${cliente.estadoNombre == 'ACTIVO'}" th:action="@{/clientes/{id}/reactivar(id=${cliente.id})}" method="post" onsubmit="return confirm('¿Reactivar este cliente?');"><button type="submit" class="btn btn-sm btn-outline-success">Reactivar</button></form>
                            </div></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="5" class="text-center">No hay clientes registrados.</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="table-footer"><span>Mostrando <strong id="cantidadVisible" th:text="${totalClientes}">0</strong> clientes</span></div>
            </section>
        </main>
    </div>
</div>
<script src="/js/clientes.js"></script>
<script src="/js/sidebar.js"></script></body>
</html>
