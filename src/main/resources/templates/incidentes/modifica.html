<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rescate Vial CR | Modificar incidente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="/css/usuarios.css"><link rel="stylesheet" href="/css/incidentes.css"></head>
<body><div class="app-layout"><aside class="sidebar"><div class="sidebar-header"><div class="brand-icon"><i class="bi bi-truck"></i></div><div class="brand-text"><h1>Rescate Vial CR</h1><span>Gestión de Asistencia Vial</span></div><button type="button" class="close-sidebar" id="closeSidebar" aria-label="Cerrar men?"><i class="bi bi-x-lg"></i></button></div><nav class="sidebar-nav"><div class="nav-section"><span class="nav-title">PRINCIPAL</span><a href="/dashboard" class="nav-link"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a></div><div class="nav-section"><span class="nav-title">OPERACIONES</span><a href="/incidentes/listado" class="nav-link active"><i class="bi bi-exclamation-triangle"></i><span>Incidentes</span></a><a href="/despacho" class="nav-link"><i class="bi bi-send"></i><span>Despacho</span></a></div></nav></aside><div class="sidebar-overlay" id="sidebarOverlay"></div><div class="main-content"><header class="topbar"><div class="topbar-left"><button type="button" class="menu-button" id="menuButton" aria-label="Abrir men?"><i class="bi bi-list"></i></button><div><h2>Modificar incidente</h2><span>Actualizar registro</span></div></div><div class="topbar-right"><div class="user-profile"><div class="user-avatar" th:text="${session.inicialesUsuario != null ? session.inicialesUsuario : 'U'}">U</div><div class="user-info"><strong th:text="${session.nombreUsuario != null ? session.nombreUsuario : #authentication.name}">Usuario</strong><span th:text="${session.usernameUsuario != null ? session.usernameUsuario : #authentication.name}">usuario</span></div></div><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="topbar-action"><i class="bi bi-box-arrow-right"></i></button></form></div></header>
<main class="page-content"><section class="page-heading"><div><span class="section-label">OPERACIONES</span><h2>Modificar incidente <span th:text="${incidenteForm.id}">1</span></h2><p>Actualice los datos del reporte y guarde los cambios.</p></div></section><div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>
<section class="content-card edit-incident-card"><form th:action="@{/incidentes/guardar}" th:object="${incidenteForm}" method="post"><input type="hidden" th:field="*{id}"><p class="required-fields-note"><span aria-hidden="true">*</span> Campos obligatorios</p><div class="form-grid">
<div class="form-group-custom"><label>Vehículo</label><select th:field="*{idVehiculo}" required><option th:each="v : ${vehiculos}" th:value="${v.id}" th:text="${v.etiqueta}"></option></select></div><div class="form-group-custom"><label>Fecha de reporte</label><input type="date" th:field="*{fechaReporte}"></div><div class="form-group-custom"><label>Hora de reporte</label><input type="time" th:field="*{horaReporte}"></div>
<div class="form-group-custom"><label class="required-label">Tipo de incidente</label><select th:field="*{idTipoIncidente}" required><option th:each="o : ${tiposIncidente}" th:value="${o.id}" th:text="${o.etiqueta}"></option></select></div><div class="form-group-custom"><label class="required-label">Prioridad</label><select th:field="*{idPrioridad}" required><option th:each="o : ${prioridades}" th:value="${o.id}" th:text="${o.etiqueta}"></option></select></div>
<fieldset class="location-section full-width"><legend>Ubicación del incidente</legend><div class="location-grid"><div class="form-group-custom"><label>Provincia</label><select id="incidenteProvincia" th:field="*{idProvincia}" required><option th:each="o : ${provincias}" th:value="${o.id}" th:text="${o.etiqueta}"></option></select></div><div class="form-group-custom"><label>Cantón</label><select id="incidenteCanton" th:field="*{idCanton}" required><option th:each="o : ${cantones}" th:value="${o.id}" th:text="${o.etiqueta}" th:attr="data-provincia=${o.relacionId}"></option></select></div><div class="form-group-custom"><label>Distrito</label><select id="incidenteDistrito" th:field="*{idDistrito}" required><option th:each="o : ${distritos}" th:value="${o.id}" th:text="${o.etiqueta}" th:attr="data-canton=${o.relacionId}"></option></select></div><div class="form-group-custom location-notes"><label>Otras señas</label><textarea rows="2" maxlength="200" th:field="*{otrasSenas}"></textarea></div></div></fieldset>
<div class="form-group-custom"><label>Estado</label><select th:field="*{idEstado}" required><option th:each="o : ${estadosIncidente}" th:value="${o.id}" th:text="${o.nombreEstado}"></option></select></div><div class="form-group-custom"><label>Fecha de cierre</label><input type="date" th:field="*{fechaCierre}"></div><div class="form-group-custom"><label>Hora de cierre</label><input type="time" th:field="*{horaCierre}"></div><div class="form-group-custom full-width"><label>Detalle</label><textarea rows="4" maxlength="500" th:field="*{detalles}"></textarea></div>
</div><div class="modal-actions"><a href="/incidentes/listado" class="btn-secondary-custom">Cancelar</a><button type="submit" class="btn-primary-custom"><i class="bi bi-check-lg"></i> Guardar cambios</button></div></form></section></main></div></div><script src="/js/sidebar.js"></script><script src="/js/incidentes.js"></script></body></html>
