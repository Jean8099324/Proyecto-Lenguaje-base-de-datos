<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rescate Vial CR | Modificar detalle</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- ESTILOS DEL PROYECTO -->
    <link rel="stylesheet" th:href="@{/css/reparaciones.css}">
</head>

<body>

    <div class="app-layout">

        <!-- MENU LATERAL -->
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <!-- FONDO DEL MENU MOVIL -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="main-content">

            <!-- BARRA SUPERIOR -->
            <header class="topbar">

                <div class="topbar-left">

                    <button class="menu-button" id="menuButton" type="button">
                        <i class="bi bi-list"></i>
                    </button>

                    <div>
                        <h2>Detalle de reparaciones</h2>
                        <span>Modificar registro</span>
                    </div>

                </div>

                <div class="topbar-right">

                    <div class="user-divider"></div>

                    <div class="user-profile">

                        <div class="user-avatar"
                            th:text="${session.inicialesUsuario != null ? session.inicialesUsuario : 'U'}">
                            U
                        </div>

                        <div class="user-info">

                            <strong
                                th:text="${session.nombreUsuario != null ? session.nombreUsuario : #authentication.name}">
                                Usuario
                            </strong>

                            <span
                                th:text="${session.usernameUsuario != null ? session.usernameUsuario : #authentication.name}">
                                usuario
                            </span>

                        </div>

                    </div>

                    <!-- CERRAR SESION -->
                    <form th:action="@{/logout}" method="post" style="margin: 0;">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <button type="submit" class="topbar-action" title="Cerrar sesión">
                            <i class="bi bi-box-arrow-right"></i>
                        </button>

                    </form>

                </div>

            </header>

            <main class="page-content">

                <!-- ENCABEZADO -->
                <section class="page-heading">

                    <div>

                        <span class="section-label">
                            GESTIÓN DEL SISTEMA
                        </span>

                        <h2>Modificar detalle</h2>

                        <p>
                            Actualice la información del repuesto
                            utilizado en la reparación.
                        </p>

                    </div>

                    <a th:href="@{/detalle-reparaciones/listado}" class="btn-secondary-custom"
                        style="text-decoration: none;">

                        <i class="bi bi-arrow-left"></i>
                        Volver al listado

                    </a>

                </section>

                <!-- FORMULARIO -->
                <section class="content-card">

                    <div class="content-card-header">

                        <div>

                            <span class="section-label">
                                EDICIÓN DE REGISTRO
                            </span>

                            <h3>Información del detalle</h3>

                        </div>

                    </div>

                    <div style="padding: 24px;">

                        <form th:action="@{/detalle-reparaciones/guardar}" th:object="${detalle}" method="post">

                            <!-- INDICAR QUE ES MODIFICACION -->
                            <input type="hidden" name="edicion" value="true">

                            <!-- CLAVE COMPUESTA -->
                            <input type="hidden" th:field="*{idReparacion}">

                            <input type="hidden" th:field="*{idRepuesto}">

                            <div class="form-grid">

                                <!-- ID REPARACION -->
                                <div class="form-group-custom">

                                    <label for="idReparacionVisual">
                                        ID de reparación
                                    </label>

                                    <input id="idReparacionVisual" type="number" th:value="*{idReparacion}" readonly>

                                </div>

                                <!-- ID REPUESTO -->
                                <div class="form-group-custom">

                                    <label for="idRepuestoVisual">
                                        ID del repuesto
                                    </label>

                                    <input id="idRepuestoVisual" type="number" th:value="*{idRepuesto}" readonly>

                                </div>

                                <!-- CANTIDAD -->
                                <div class="form-group-custom">

                                    <label for="cantidadRepuestos">
                                        Cantidad de repuestos
                                    </label>

                                    <input id="cantidadRepuestos" type="number" min="0.01" step="any"
                                        th:field="*{cantidadRepuestos}">

                                </div>

                                <!-- PRECIO UNITARIO -->
                                <div class="form-group-custom">

                                    <label for="precioUnitarioAplicado">
                                        Precio unitario aplicado
                                    </label>

                                    <input id="precioUnitarioAplicado" type="number" min="0" step="0.01"
                                        th:field="*{precioUnitarioAplicado}">

                                </div>

                                <!-- SUBTOTAL -->
                                <div class="form-group-custom">

                                    <label for="subtotal">
                                        Subtotal
                                    </label>

                                    <input id="subtotal" type="number" step="0.01" th:value="${detalle.subtotal}"
                                        readonly>

                                    <small>
                                        Calculado automáticamente.
                                    </small>

                                </div>

                                <!-- ESTADO -->
                                <div class="form-group-custom">

                                    <label for="estado">
                                        Estado
                                    </label>

                                    <select id="estado" th:field="*{estado}" required>

                                        <option value="">
                                            Seleccione estado
                                        </option>

                                        <option th:each="estadoItem : ${estados}" th:value="${estadoItem.id}"
                                            th:text="${estadoItem.nombreEstado}">
                                            Estado
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <!-- BOTONES -->
                            <div class="modal-actions" style="margin-top: 28px;">

                                <a th:href="@{/detalle-reparaciones/listado}" class="btn-secondary-custom"
                                    style="text-decoration: none;">

                                    Cancelar

                                </a>

                                <button type="submit" class="btn-primary-custom">

                                    <i class="bi bi-check-lg"></i>
                                    Guardar cambios

                                </button>

                            </div>

                        </form>

                    </div>

                </section>

            </main>

        </div>

    </div>

    <!-- JAVASCRIPT DEL MODULO -->
    <script th:src="@{/js/detalle-reparaciones.js}"></script>

<script src="/js/sidebar.js"></script></body>

</html>
