<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rescate Vial CR | Contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/usuarios.css">
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left"><button type="button" class="menu-button" id="menuButton"><i class="bi bi-list"></i></button>
                <div><h2>Contactos</h2><span>Administración de contactos</span></div>
            </div>
            <div class="topbar-right"><div class="user-divider"></div>
                <div class="user-profile">
                    <div class="user-avatar" th:text="${session.inicialesUsuario != null ? session.inicialesUsuario : 'U'}">U</div>
                    <div class="user-info"><strong th:text="${session.nombreUsuario != null ? session.nombreUsuario : #authentication.name}">Usuario</strong>
                        <span th:text="${session.usernameUsuario != null ? session.usernameUsuario : #authentication.name}">usuario</span>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post"><button type="submit" class="topbar-action" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button></form>
            </div>
        </header>
        <main class="page-content">
            <section class="page-heading">
                <div><span class="section-label">GESTIÓN DEL SISTEMA</span>
                    <h2 th:text="${esNuevo ? 'Registrar contacto' : 'Modificar contacto'}">Contacto</h2>
                    <p>Complete la información del contacto.</p>
                </div>
                <a href="/contactos" class="btn-secondary-custom"><i class="bi bi-arrow-left"></i> Volver al listado</a>
            </section>
            <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>
            <section class="content-card">
                <div class="content-card-header"><div><span class="section-label">REGISTRO</span><h3>Información del contacto</h3></div></div>
                <form th:action="@{/contactos/guardar}" th:object="${contactoForm}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="form-grid" style="padding:24px 25px 0;">
                        <div class="form-group-custom"><label for="nombreContacto">Nombre</label>
                            <input id="nombreContacto" th:field="*{nombreContacto}" maxlength="100" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('nombreContacto')}" th:errors="*{nombreContacto}"></small>
                        </div>
                        <div class="form-group-custom"><label for="primerApellido">Primer apellido</label>
                            <input id="primerApellido" th:field="*{primerApellido}" maxlength="100" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('primerApellido')}" th:errors="*{primerApellido}"></small>
                        </div>
                        <div class="form-group-custom"><label for="segundoApellido">Segundo apellido</label>
                            <input id="segundoApellido" th:field="*{segundoApellido}" maxlength="100">
                        </div>
                        <div class="form-group-custom"><label for="telefonoContacto">Teléfono</label>
                            <input id="telefonoContacto" type="tel" th:field="*{telefonoContacto}" maxlength="20" placeholder="Ej. 8888-8888">
                        </div>
                        <div class="form-group-custom"><label for="correoContacto">Correo electrónico</label>
                            <input id="correoContacto" type="email" th:field="*{correoContacto}" maxlength="150" placeholder="correo@ejemplo.com">
                            <small class="text-danger" th:if="${#fields.hasErrors('correoContacto')}" th:errors="*{correoContacto}"></small>
                        </div>
                    </div>
                    <p class="text-muted" style="padding: 5px 25px;">Debe proporcionar al menos un teléfono o un correo electrónico.</p>
                    <div class="modal-actions" style="padding:0 25px 22px;">
                        <a href="/contactos" class="btn-secondary-custom">Cancelar</a>
                        <button type="submit" class="btn-primary-custom"><i class="bi bi-check-lg"></i> Guardar contacto</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</div>
<script src="/js/contactos.js"></script>
<script src="/js/sidebar.js"></script></body>
</html>
