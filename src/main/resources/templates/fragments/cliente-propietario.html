<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="selector(actual)" class="form-group-custom full-width cliente-propietario" th:attr="data-actual=${actual}">
 <label>Cliente dueño del vehículo <span class="required-mark" aria-hidden="true">*</span></label>
 <input type="search" class="buscar-cliente" placeholder="Buscar cliente por nombre o número de registro" aria-label="Buscar cliente">
 <select name="idUsuario" class="seleccionar-cliente" aria-label="Cliente dueño del vehículo" required><option value="">Seleccione un cliente</option></select>
 <div class="cliente-resumen" hidden>
  <strong>Resumen del cliente</strong>
  <dl>
   <div><dt>Nombre</dt><dd data-resumen="nombre">—</dd></div>
   <div><dt>Username</dt><dd data-resumen="username">No registrado</dd></div>
   <div><dt>Teléfono</dt><dd data-resumen="telefonos">Sin registrar</dd></div>
   <div><dt>Correo</dt><dd data-resumen="correos">Sin registrar</dd></div>
   <div class="cliente-resumen-wide"><dt>Dirección</dt><dd data-resumen="direccion">Sin registrar</dd></div>
  </dl>
 </div>
 <button type="button" class="btn-secondary-custom abrir-cliente">Crear cliente nuevo</button>
 <fieldset class="nuevo-cliente" hidden><legend>Datos del nuevo cliente</legend><p>Registra sus datos sin habilitar una cuenta de acceso. Los campos con <span class="required-mark" aria-hidden="true">*</span> son obligatorios.</p>
 <div class="form-grid">
 <div class="form-group-custom"><label>Nombre <span class="required-mark" aria-hidden="true">*</span><input data-campo="nombre" aria-required="true" maxlength="100"></label></div>
 <div class="form-group-custom"><label>Primer apellido <span class="required-mark" aria-hidden="true">*</span><input data-campo="primerApellido" aria-required="true" maxlength="100"></label></div>
 <div class="form-group-custom"><label>Segundo apellido<input data-campo="segundoApellido" maxlength="100"></label></div>
 <div class="form-group-custom"><label>Provincia <span class="required-mark" aria-hidden="true">*</span><select data-campo="idProvincia" aria-required="true"></select></label></div>
 <div class="form-group-custom"><label>Cantón <span class="required-mark" aria-hidden="true">*</span><select data-campo="idCanton" aria-required="true"></select></label></div>
 <div class="form-group-custom"><label>Distrito <span class="required-mark" aria-hidden="true">*</span><select data-campo="idDistrito" aria-required="true"></select></label></div>
 <div class="form-group-custom full-width"><label>Otras señas<textarea data-campo="otrasSenas" maxlength="200"></textarea></label></div>
 <div class="form-group-custom"><label>Teléfono<input data-campo="telefono" type="tel" maxlength="8"></label></div>
 <div class="form-group-custom"><label>Correo<input data-campo="correo" type="email" maxlength="150"></label></div>
 </div><button type="button" class="btn-primary-custom guardar-cliente">Guardar y seleccionar cliente</button>
 <button type="button" class="btn-secondary-custom cancelar-cliente">Cancelar</button></fieldset>
 <p class="error-cliente text-danger" role="alert"></p>
</section></body></html>
